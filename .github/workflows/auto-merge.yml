name: Auto-merge PRs

# A PR is raised -> squash-merge it immediately -> kick off the build & deploy.
# No waiting for checks: there are none.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write # squash-merge + delete branch
  pull-requests: write # merge the PR
  actions: write # dispatch deploy.yml

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge-and-deploy:
    if: github.event.pull_request.draft == false && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
      ASSOCIATION: ${{ github.event.pull_request.author_association }}
    steps:
      - name: Merge the PR, then deploy
        run: |
          set -uo pipefail

          # The one guard kept: merging is instant and publishes straight to the live site, so
          # a stranger's fork PR must not be able to put code on your domain unattended.
          trusted=no
          case "$ASSOCIATION" in OWNER|MEMBER|COLLABORATOR) trusted=yes ;; esac
          case "$AUTHOR" in dependabot|dependabot\[bot\]) trusted=yes ;; esac
          if [ "$trusted" != "yes" ]; then
            echo "::warning::PR #$PR is from $AUTHOR ($ASSOCIATION) — not auto-merging. Merge it yourself if you trust it."
            exit 0
          fi

          # GitHub can need a moment to work out mergeability on a freshly opened PR.
          merged=no
          for attempt in 1 2 3; do
            if gh pr merge "$PR" --squash --delete-branch --repo "$REPO"; then merged=yes; break; fi
            echo "merge attempt $attempt failed; retrying..."
            sleep 5
          done
          if [ "$merged" != "yes" ]; then
            echo "::warning::Could not merge PR #$PR (conflicts, or a branch rule blocked it). Nothing deployed."
            exit 0
          fi
          echo "Merged PR #$PR."

          # A merge made with GITHUB_TOKEN raises no push event, so start the deploy explicitly.
          for attempt in 1 2 3; do
            if gh workflow run deploy.yml --repo "$REPO" --ref main; then
              echo "Build & deploy dispatched on main."
              exit 0
            fi
            sleep 10
          done
          echo "::error::PR #$PR merged but dispatching deploy.yml failed. Run it manually on main."
          exit 1
