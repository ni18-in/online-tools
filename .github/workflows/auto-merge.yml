name: Auto-Merge Pull Requests

# Runs as pull_request_target so forked PRs still get a write-scoped token.
# NOTE: this workflow must never check out or execute PR code — it only calls
# the GitHub API with the PR number.
on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write # squash-merge + delete branch
  pull-requests: write # enable auto-merge
  checks: read # read the PR's check runs
  actions: write # dispatch deploy.yml after the merge lands

# One waiter per PR — a new push to the PR replaces the previous waiter.
concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable-automerge:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      BASE: ${{ github.event.pull_request.base.ref }}
      SELF: ${{ github.workflow }}
    steps:
      # Native auto-merge is the preferred path: GitHub holds the PR until every
      # required check passes, with no runner sitting idle. It needs "Allow
      # auto-merge" enabled in Settings → General.
      - name: Enable native auto-merge
        id: auto
        run: |
          set -uo pipefail
          if gh pr merge "$PR" --auto --squash --delete-branch --repo "$REPO"; then
            echo "mode=native" >>"$GITHUB_OUTPUT"
            echo "Native auto-merge enabled for PR #$PR."
          else
            echo "mode=manual" >>"$GITHUB_OUTPUT"
            echo "::warning::Native auto-merge unavailable (enable it in Settings → General). Falling back to a checks-gated merge from this job."
          fi

      # Fallback only. Waits for this PR's *other* checks to finish and never
      # merges while anything is pending or failing, so the build + SEO/URL gate
      # still holds. A plain `gh pr merge --squash` here would ship unverified.
      - name: Wait for checks, then squash-merge
        if: steps.auto.outputs.mode == 'manual'
        run: |
          set -uo pipefail
          deadline=$(( $(date +%s) + 40 * 60 ))

          while [ "$(date +%s)" -lt "$deadline" ]; do
            # Exclude this workflow's own check run, or we would wait on ourselves.
            buckets="$(gh pr checks "$PR" --repo "$REPO" --json bucket,workflow \
              -q ".[] | select(.workflow != \"$SELF\") | .bucket" 2>/dev/null || true)"

            if printf '%s\n' "$buckets" | grep -qxE 'fail|cancel'; then
              echo "::error::PR #$PR has failing checks — refusing to merge."
              exit 1
            fi

            if [ -n "$(printf '%s' "$buckets" | tr -d '[:space:]')" ] \
              && ! printf '%s\n' "$buckets" | grep -qx 'pending'; then
              echo "All checks green — squash-merging PR #$PR."
              gh pr merge "$PR" --squash --delete-branch --repo "$REPO"
              exit 0
            fi

            sleep 20
          done

          echo "::error::PR #$PR checks never completed within 40m — not merging."
          exit 1

      # A merge performed with GITHUB_TOKEN does NOT create a push workflow run,
      # so deploy.yml never fires on main after an auto-merge. Wait for the merge
      # to land, then trigger the deploy explicitly — workflow_dispatch is the one
      # event type GitHub still delivers when GITHUB_TOKEN is the actor.
      - name: Wait for merge, then dispatch the Pages deploy
        if: env.BASE == 'main'
        run: |
          set -uo pipefail
          deadline=$(( $(date +%s) + 45 * 60 ))

          while [ "$(date +%s)" -lt "$deadline" ]; do
            # Tolerate transient API failures: an empty read just retries.
            info="$(gh pr view "$PR" --repo "$REPO" \
              --json state,mergeStateStatus \
              -q '[.state, .mergeStateStatus] | @tsv' 2>/dev/null || true)"

            if [ -n "$info" ]; then
              IFS=$'\t' read -r state merge_state <<<"$info"

              case "$state" in
                MERGED)
                  echo "PR #$PR merged into main — dispatching deploy.yml."
                  for attempt in 1 2 3; do
                    if gh workflow run deploy.yml --repo "$REPO" --ref main; then
                      echo "Deploy dispatched (attempt $attempt)."
                      exit 0
                    fi
                    sleep 10
                  done
                  echo "::error::PR #$PR merged but dispatching deploy.yml failed 3x. Run the deploy workflow manually on main."
                  exit 1
                  ;;
                CLOSED)
                  echo "PR #$PR was closed without merging — nothing to deploy."
                  exit 0
                  ;;
              esac

              # Auto-merge can never fire while the PR is unmergeable.
              if [ "$merge_state" = "DIRTY" ]; then
                echo "::warning::PR #$PR has merge conflicts — auto-merge is parked until they are resolved."
                exit 0
              fi
            fi

            sleep 20
          done

          echo "::warning::PR #$PR still open after 45m (checks failing or review pending). Once it merges, run 'Build, verify & deploy to GitHub Pages' manually on main."
