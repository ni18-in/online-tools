name: Build & deploy to GitHub Pages

# main changes -> build -> publish. Nothing else.
#   push to main : after a merge by a human or a direct push
#   dispatch     : manual, and how auto-merge.yml kicks this off (a merge made with
#                  GITHUB_TOKEN does not raise a push event)
# There is deliberately no pull_request trigger: PRs are merged on sight, so there is
# nothing to validate beforehand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write # actions/deploy-pages
  id-token: write # OIDC verification of the deployment origin

# Never cancel a publish midway; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
