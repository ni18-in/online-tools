name: Build, verify & deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Allow the GITHUB_TOKEN to deploy to Pages + verify the deployment origin + merge PRs.
permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

# Serialize per ref so PR validation runs don't cancel a production deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs on PRs AND main: builds, runs the SEO/URL gate + functional tests, uploads the artifact.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Verify SEO + URL inventory (gates deploy)
        run: npm run verify:build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Functional smoke tests (per tool)
        run: npm run test:e2e
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Automatically merges Pull Requests into main after all build & test checks pass.
  automerge:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Auto-merge PR on green CI build
        run: |
          echo "Attempting auto-merge for PR #${{ github.event.pull_request.number }}..."
          gh pr merge "${{ github.event.pull_request.number }}" --auto --squash --delete-branch || \
          gh pr merge "${{ github.event.pull_request.number }}" --admin --squash --delete-branch || \
          gh pr merge "${{ github.event.pull_request.number }}" --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Deploys ONLY from main (push or manual dispatch) — never from a pull request.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

