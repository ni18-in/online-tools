version: 2
updates:
  # npm deps. Astro/Tailwind/Playwright majors land as separate PRs so a breaking
  # upgrade is reviewable on its own; everything else is grouped to cut PR noise.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Build-critical majors, opted out of automation on purpose.
      # tailwindcss v4 moved its PostCSS plugin to @tailwindcss/postcss and stopped reading
      # tailwind.config.mjs, so an auto-merged v3->v4 bump broke `npm run build` on main
      # outright. astro majors can change build.format/trailingSlash, i.e. the URL contract
      # verify-build.mjs enforces. Both need a deliberate migration PR, not a bot bump.
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
      - dependency-name: astro
        update-types: [version-update:semver-major]
    commit-message:
      prefix: 'chore(deps)'

  # Action versions — these pin the deploy path, so keep them current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(actions)'
